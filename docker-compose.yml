services:
  redis:
    image: redis:7-alpine
    container_name: gamerai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: gamerai-coordinator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_PATH: /data/gamerai.db
      JOB_TIMEOUT_SECONDS: "120"
      WORKER_TIMEOUT_SECONDS: "15"
      API_TOKEN: ${API_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      COORDINATOR_URL: http://coordinator:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      MODEL: ${MODEL:-llama3.2:1b}
      POLL_INTERVAL: "2.5"
      RATE_PER_TOKEN: "0.000005"
      WORKER_SHARE: "0.7"
      MOCK_INFERENCE: ${MOCK_INFERENCE:-false}
      AVAILABILITY_WINDOW: ${AVAILABILITY_WINDOW:-always}
      NETWORK_DELAY_MIN: "0.5"
      NETWORK_DELAY_MAX: "3.0"
      COLD_START_MIN: "2.0"
      COLD_START_MAX: "8.0"
      API_TOKEN: ${API_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: gamerai-client
    depends_on:
      coordinator:
        condition: service_started
    environment:
      COORDINATOR_URL: http://coordinator:8000
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "8080:8080"
