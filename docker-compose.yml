services:
  redis:
    image: redis:7-alpine
    container_name: gamerai-redis
    # Bind to localhost only. Docker publishes ports by punching through
    # the host firewall (ufw won't save you), so a 0.0.0.0 bind would
    # expose the queue to the internet on any host that runs this base
    # file directly. Container-to-container traffic uses the Docker
    # network (service name "redis"), NOT this published port, so this
    # restricts host access only. The prod overlay also pins 127.0.0.1.
    ports:
      - "127.0.0.1:6379:6379"
    # Optional auth: --requirepass reads REDIS_PASSWORD; empty disables
    # auth (the default), so this is a no-op until an operator sets it.
    # sh -c + $$ so the container shell expands the var (server and the
    # python clients read the SAME var via shared.config.redis_kwargs,
    # so they can't drift). `exec` keeps redis as PID 1 for signals.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      # Authenticate only when a password is set, so the probe works in
      # both modes without emitting redis-cli's insecure-'-a' warning.
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Opt-in: only starts when --profile local-inference is passed.
  # Prod runs MOCK_INFERENCE=true and doesn't need this — real inference
  # comes from external gamer machines, not the VPS.
  ollama:
    profiles: ["local-inference"]
    build:
      context: .
      dockerfile: ollama/Dockerfile
    container_name: gamerai-ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ./ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: gamerai-coordinator
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      # Matches the redis service's --requirepass. Empty = no auth.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DB_PATH: /data/gamerai.db
      JOB_TIMEOUT_SECONDS: "120"
      WORKER_TIMEOUT_SECONDS: "15"
      API_TOKEN: ${API_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-0}
      MAX_PROMPT_BYTES: ${MAX_PROMPT_BYTES:-0}
      CAPACITY_JOBS_PER_WORKER: ${CAPACITY_JOBS_PER_WORKER:-0}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
      REQUIRE_LIVE_WORKER: ${REQUIRE_LIVE_WORKER:-false}
      # Smart-tier model override (empty = registry default, currently
      # qwen2.5:14b). Point at a smaller chat model (e.g. qwen2.5:7b)
      # to test/refine the smart pipeline without the 9 GB download —
      # see docs/smart-mode.md "Testing with a smaller model".
      SMART_MODEL: ${SMART_MODEL:-}
      # Web Push (Phase 6 of pwa-refactor.txt). All three are optional
      # — coordinator gracefully no-ops push delivery when unset.
      # Defaults preserve the "unset" sentinel, not a literal empty
      # string, so notifications.is_vapid_configured() returns False.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY_PATH: ${VAPID_PRIVATE_KEY_PATH:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - ./data:/data
      # Read-only mount for the VAPID private key. The key file lives
      # outside the image (gitignored .secrets/) so rebuilding the
      # coordinator image doesn't bake a secret in. VAPID_PRIVATE_KEY_PATH
      # in .env should point at /secrets/vapid_private.pem to match.
      - ./.secrets:/secrets:ro
    # Localhost-only (see redis note). Public traffic reaches the
    # coordinator through Caddy on 443, never this raw port; inter-
    # container calls use the "coordinator" service name. Prod overrides
    # to 127.0.0.1 too.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      coordinator:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      # Matches the redis service's --requirepass. Empty = no auth.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      COORDINATOR_URL: http://coordinator:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      MODEL: ${MODEL:-llama3.2:1b}
      POLL_INTERVAL: "2.5"
      RATE_PER_TOKEN: "0.000005"
      WORKER_SHARE: "0.7"
      MOCK_INFERENCE: ${MOCK_INFERENCE:-false}
      AVAILABILITY_WINDOW: ${AVAILABILITY_WINDOW:-always}
      NETWORK_DELAY_MIN: "0.5"
      NETWORK_DELAY_MAX: "3.0"
      COLD_START_MIN: "2.0"
      COLD_START_MAX: "8.0"
      API_TOKEN: ${API_TOKEN:-}

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: gamerai-client
    depends_on:
      coordinator:
        condition: service_started
    environment:
      COORDINATOR_URL: http://coordinator:8000
      API_TOKEN: ${API_TOKEN:-}
    # Localhost-only (see redis note). The web UI is served publicly via
    # Caddy on 443; this raw port is for host/dev access only. Prod
    # overrides to 127.0.0.1 too.
    ports:
      - "127.0.0.1:8080:8080"
