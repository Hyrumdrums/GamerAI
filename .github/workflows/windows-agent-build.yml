name: windows-agent build

# Builds the GamerAI Windows agent (`agent.exe`) plus the bundled
# Inno Setup installer (`GamerAI-Agent-Setup.exe`) on a windows-latest
# runner, then SFTP-uploads both artifacts into /var/www/downloads on
# the production VPS so they're served at
# https://ai.dallinlayton.com/download/.
#
# Triggers:
#   - push to main that touches windows-agent/** (the usual case)
#   - manual workflow_dispatch (for re-publishing without code changes)
#
# Secrets required (already configured on the repo):
#   VPS_SSH_KEY      private ed25519 key for the chroot-only SFTP user
#                    `gamerai-uploads` on the VPS
#   VPS_HOST         public IP / hostname of the VPS
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -H <host>` — prevents the
#                    first-connection trust-on-first-use prompt
#
# The CI SSH key cannot escape /var/www/downloads-chroot on the VPS;
# AllowTcpForwarding/ForceCommand-internal-sftp/ChrootDirectory are
# all enforced in sshd_config. See devlog 2026-05-11 "Windows exe
# build + download surface" for the full setup.

on:
  push:
    branches: [main]
    paths:
      - windows-agent/**
      - .github/workflows/windows-agent-build.yml
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        working-directory: windows-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write version.txt for the build
        # The agent reads this file at startup (bundled via PyInstaller
        # --add-data) and the self-updater compares it against the
        # version.txt that this workflow also publishes to /download/.
        # Format: a single line "<short-sha> <iso-utc>" so a contributor
        # can eyeball mismatches in the log without parsing JSON.
        working-directory: windows-agent
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          "$sha $now" | Out-File -FilePath version.txt -Encoding ascii -NoNewline
          Get-Content version.txt
          Write-Host ""

      - name: Build agent.exe (PyInstaller)
        working-directory: windows-agent
        run: |
          pyinstaller --onefile --name agent `
            --add-data "config.json;." `
            --add-data "version.txt;." `
            --add-data "tray.ico;." `
            --collect-submodules pystray `
            --icon "tray.ico" `
            agent.py
          if (-not (Test-Path "dist\agent.exe")) {
            Write-Error "agent.exe was not produced"
            exit 1
          }
          Get-Item dist\agent.exe | Select-Object Name, Length

      - name: Sign agent.exe (Ed25519)
        # Authenticity for self-updates: agents with UPDATE_PUBLIC_KEY
        # embedded fail-closed-verify agent.exe.sig before swapping, so a
        # compromised download host can't push code to the fleet. The
        # signing seed lives ONLY in this secret, never on the VPS.
        working-directory: windows-agent
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          # Read the public key the shipping agent will enforce against.
          $line = Select-String -Path agent.py `
            -Pattern '^UPDATE_PUBLIC_KEY\s*=\s*"([^"]*)"'
          $pubkey = if ($line) { $line.Matches[0].Groups[1].Value } else { "" }
          $haveSecret = -not [string]::IsNullOrWhiteSpace($env:AGENT_SIGNING_KEY)
          # Interlock: refuse to ship a build that ENFORCES signatures
          # without also publishing one — otherwise every agent that
          # updates to it would then fail-closed and never update again.
          if ($pubkey -ne "" -and -not $haveSecret) {
            Write-Error ("agent.py sets UPDATE_PUBLIC_KEY but the " +
              "AGENT_SIGNING_KEY secret is missing. Agents on this build " +
              "would refuse all further updates. Add the secret (see " +
              "docs/OPERATOR.md 'Agent update signing') or clear the key.")
            exit 1
          }
          if ($haveSecret) {
            python ..\tools\sign_agent.py dist\agent.exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signing failed"; exit 1 }
            Write-Host "Signed dist\agent.exe -> dist\agent.exe.sig"
          } else {
            Write-Host ("No AGENT_SIGNING_KEY and no embedded public key " +
              "- skipping signing (legacy SHA-only updates).")
          }

      - name: Install Inno Setup
        # Inno Setup ships ISCC.exe (the compiler). Chocolatey ships
        # innosetup as a pinned package on the windows-latest runner.
        run: choco install innosetup --no-progress -y

      - name: Compile installer.iss
        working-directory: windows-agent
        run: |
          # Extract AGENT_VERSION from agent.py — single source of
          # truth for the version string. Without this, installer.iss
          # used a hardcoded placeholder ("0.1.0") that never tracked
          # the real binary, and Add/Remove Programs lied indefinitely.
          $line = Select-String -Path agent.py -Pattern '^AGENT_VERSION\s*=\s*"([^"]+)"'
          if (-not $line) {
            Write-Error "AGENT_VERSION not found in agent.py"
            exit 1
          }
          $agentVersion = $line.Matches[0].Groups[1].Value
          Write-Host "Compiling installer at version $agentVersion"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & "$iscc" "/DMyAppVersion=$agentVersion" installer.iss
          if (-not (Test-Path "Output\GamerAI-Agent-Setup.exe")) {
            Write-Error "GamerAI-Agent-Setup.exe was not produced"
            exit 1
          }
          Get-Item Output\GamerAI-Agent-Setup.exe | Select-Object Name, Length

      - name: Stage artifacts for upload
        working-directory: windows-agent
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Copy-Item dist\agent.exe upload\agent.exe
          Copy-Item Output\GamerAI-Agent-Setup.exe upload\GamerAI-Agent-Setup.exe
          # version.txt is the latest-published-version file the
          # installed agents poll for self-update.
          Copy-Item version.txt upload\version.txt
          # SHA256 sidecar — the agent's _apply_update fetches this
          # alongside agent.exe and refuses to swap if the local hash
          # doesn't match. Defends against truncated downloads, AV
          # quarantine-and-restore stubs, and bit-rot in transit.
          # Format matches `sha256sum agent.exe` output so the file is
          # also usable with stock POSIX tools for manual verification.
          $hash = (Get-FileHash dist\agent.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  agent.exe" | Out-File -FilePath upload\agent.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "Published SHA256: $hash"
          # Ed25519 signature sidecar (only present when signing is
          # configured). Authenticity, vs the sha256's integrity-only.
          if (Test-Path dist\agent.exe.sig) {
            Copy-Item dist\agent.exe.sig upload\agent.exe.sig
            Write-Host "Staged agent.exe.sig"
          }
          # A small index helps Caddy's browse view be self-explanatory.
          $sha = "${{ github.sha }}".Substring(0, 7)
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm 'UTC'")
          @"
          GamerAI Windows agent — build $sha — $now
          Repo commit: ${{ github.sha }}
          Files:
            agent.exe                  standalone executable; pair with a config.json
            agent.exe.sha256           sha256sum-format sidecar; self-update verifies against this
            GamerAI-Agent-Setup.exe    Inno Setup installer (Start Menu shortcuts, optional autostart)
          "@ | Out-File -FilePath upload\BUILD.txt -Encoding utf8

      - name: Configure SSH
        run: |
          New-Item -ItemType Directory -Force -Path $HOME\.ssh | Out-Null
          $key = "${{ secrets.VPS_SSH_KEY }}"
          [System.IO.File]::WriteAllText("$HOME\.ssh\id_ci", $key)
          icacls "$HOME\.ssh\id_ci" /inheritance:r /grant:r "$($env:UserName):F" | Out-Null
          $known = "${{ secrets.VPS_KNOWN_HOSTS }}"
          [System.IO.File]::WriteAllText("$HOME\.ssh\known_hosts", $known)

      - name: Upload artifacts via SFTP
        working-directory: windows-agent
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # sftp batch file — uploads into the chroot's /uploads dir
          # Upload the sha256 + .sig sidecars BEFORE agent.exe + version.txt
          # so an agent that races the publish window never sees a
          # version.txt mismatch driving it to download an agent.exe whose
          # sidecars haven't landed yet. Once the sidecars are on disk we
          # publish agent.exe; once that's on disk we bump version.txt
          # (the trigger for clients). Strict ordering. The .sig line is
          # included only when signing produced one.
          $lines = @(
            "cd uploads",
            "put upload/agent.exe.sha256 agent.exe.sha256"
          )
          if (Test-Path upload/agent.exe.sig) {
            $lines += "put upload/agent.exe.sig agent.exe.sig"
          }
          $lines += @(
            "put upload/agent.exe agent.exe",
            "put upload/GamerAI-Agent-Setup.exe GamerAI-Agent-Setup.exe",
            "put upload/version.txt version.txt",
            "put upload/BUILD.txt BUILD.txt",
            "bye"
          )
          ($lines -join "`n") | Out-File -FilePath sftp.batch -Encoding ascii

          sftp -i $HOME\.ssh\id_ci `
               -o UserKnownHostsFile=$HOME\.ssh\known_hosts `
               -b sftp.batch `
               gamerai-uploads@$env:VPS_HOST
          if ($LASTEXITCODE -ne 0) {
            Write-Error "SFTP upload failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Summary
        run: |
          Write-Host "Published artifacts:"
          Write-Host "  https://ai.dallinlayton.com/download/agent.exe"
          Write-Host "  https://ai.dallinlayton.com/download/agent.exe.sha256"
          Write-Host "  https://ai.dallinlayton.com/download/GamerAI-Agent-Setup.exe"
          Write-Host "  https://ai.dallinlayton.com/download/BUILD.txt"
