# Production overlay for the GamerAI MVP.
#
# Layered on top of the base docker-compose.yml. Differences from local dev:
#
# - Adds Caddy on :80/:443 with automatic Let's Encrypt TLS.
# - Restricts internal services (coordinator, redis, client) to localhost-only
#   port bindings; only Caddy faces the public internet.
# - Hides the in-VPS worker behind the `mock-worker` Compose profile.
#   The VPS has no GPU, so the only thing that worker can do is run
#   MOCK_INFERENCE — which we don't want fronting real users. Real
#   inference comes from gamer machines connecting in via the public
#   URL. Operators who explicitly want the in-VPS mock (e.g. for a
#   staging walkthrough) pass `--profile mock-worker` to bring it up.
# - restart: unless-stopped on every service so a reboot brings everything back.

services:
  redis:
    restart: unless-stopped
    # !override replaces the base compose ports list entirely (compose
    # otherwise appends, leading to a double-bind on both 0.0.0.0 and 127.0.0.1).
    ports: !override
      - "127.0.0.1:6379:6379"

  coordinator:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"

  worker:
    # Gated behind the `mock-worker` profile — by default `docker compose
    # up` on prod brings up everything EXCEPT this. Without a profile
    # active, no in-VPS worker means /generate (with REQUIRE_LIVE_WORKER=true)
    # returns "no community members available" until a real gamer
    # machine connects in.
    profiles: ["mock-worker"]
    restart: unless-stopped
    environment:
      MOCK_INFERENCE: "${MOCK_INFERENCE:-true}"

  client:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      # PUBLIC_BASE_URL tells the web UI whether to set the Secure flag
      # on session cookies (Secure stops them from being sent over
      # plain HTTP). When DOMAIN is set, we're behind Caddy + TLS, so
      # cookies should be Secure. Falls back to http:// in local dev.
      PUBLIC_BASE_URL: "https://${DOMAIN}"

  caddy:
    image: caddy:2-alpine
    container_name: gamerai-caddy
    restart: unless-stopped
    depends_on:
      - coordinator
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # CI uploads the Windows agent installer here via SFTP (see
      # .github/workflows/windows-agent-build.yml). The dir is host-managed
      # and exposed read-only inside the container.
      - /var/www/downloads:/srv/downloads:ro

volumes:
  caddy_data:
  caddy_config:
